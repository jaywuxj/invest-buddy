</style><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9A978E"/></marker></defs><rect class="bl" x="20" y="16" width="640" height="66" rx="5"/><text class="h" x="340.0" y="53.0" text-anchor="middle"></text><text class="h" x="340" y="36" text-anchor="middle">数据平面（本机）</text><text class="s" x="340" y="54" text-anchor="middle">行情 · 财务指标 · 财报三表 · 券商评级 · 公告 · 新闻 —— 全部只进不出，持仓与成本永不离开本机</text><rect class="bl" x="20" y="100" width="640" height="66" rx="5"/><text class="h" x="340.0" y="137.0" text-anchor="middle"></text><text class="h" x="340" y="120" text-anchor="middle">计算平面（程序，确定性）</text><text class="s" x="340" y="138" text-anchor="middle">财务比率 · 估值打分 · 决策四维 · 纪律闸门 · 归因分解 · 命中率统计 —— 模型不触碰数字</text><rect class="bl" x="20" y="184" width="640" height="66" rx="5"/><text class="h" x="340.0" y="221.0" text-anchor="middle"></text><text class="h" x="340" y="204" text-anchor="middle">叙述平面（LLM）</text><text class="s" x="340" y="222" text-anchor="middle">新闻筛选 · 事件归类 · 公司一页纸 · 大师视角 · 问答 —— 只写文字，输出须过数字对账</text><rect class="bl" x="20" y="268" width="640" height="60" rx="5"/><text class="h" x="340.0" y="302.0" text-anchor="middle"></text><text class="h" x="340" y="288" text-anchor="middle">问责平面（程序）</text><text class="s" x="340" y="306" text-anchor="middle">数字后置对账 · 前向准确率账本（有效样本量修正）· 结论快照 · 数据新鲜度自愈</text><path class="ar" d="M340 82 L340 100"/><path class="ar" d="M340 166 L340 184"/><path class="ar" d="M340 250 L340 268"/></svg>