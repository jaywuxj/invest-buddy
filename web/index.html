<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资Buddy</title>
<style>
  :root {
    --bg: #F7F6F3;
    --panel: #FFFFFF;
    --ink: #1F2329;
    --ink-2: #4E5560;
    --ink-3: #8A919C;
    --line: #ECEAE4;
    --up: #D63A2F;
    --up-bg: #FBEFED;
    --down: #1E9E6A;
    --down-bg: #EAF6F0;
    --flat: #8A919C;
    --accent: #B5392A;
    --chip: #F1EFE9;
    --chip-2: #E6E3D9;
    --bullish-bg: #FBEFED; --bullish-ink: #B5392A;
    --normal-bg: #EEF3FA;  --normal-ink: #2F5FA3;
    --neutral-bg: #F5F2EA; --neutral-ink: #8A6D1F;
    --watch-bg: #F3EEFA;   --watch-ink: #6A3FA8;
    --ok: #1E9E6A; --bad: #D63A2F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  b.num { color: var(--ink); font-weight: 600; }  /* 正文数字只加粗不染色；红绿只留给有涨跌含义的数据（.up/.down） */
  a { color: inherit; text-decoration: none; }

  /* ============ 左侧栏 ============ */
  .sidebar {
    width: 272px; min-width: 272px; flex-shrink: 0;
    background: var(--panel);
    padding: 20px 14px;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sideTabs { flex-shrink: 0; }
  #sideList { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 20px; scrollbar-width: thin; scrollbar-color: transparent transparent; scrollbar-gutter: stable; }
  #sideList:hover, #sideList.scrolling { scrollbar-color: #D3D1C7 transparent; }
  #sideList::-webkit-scrollbar { width: 6px; }
  #sideList::-webkit-scrollbar-track { background: transparent; }
  #sideList::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  #sideList:hover::-webkit-scrollbar-thumb, #sideList.scrolling::-webkit-scrollbar-thumb { background: #D3D1C7; }
  .brand { font-size: 1.1rem; font-weight: 700; padding: 2px 10px 16px; display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }
  .brand .tag { font-size: 0.7rem; font-weight: 400; color: var(--ink-3); background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .brand .rf-btn {
    margin-left: auto; width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-2);
    font-size: 0.85rem; line-height: 1; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .brand .rf-btn:hover { background: var(--chip); }
  .brand .rf-btn.spin svg, .brand .rf-btn.spin span { animation: rf-spin 0.9s linear infinite; display: inline-block; }
  @keyframes rf-spin { to { transform: rotate(360deg); } }
  .brand .rf-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .brand .rf-dot.ok { background: #16a34a; }
  .brand .rf-dot.bad { background: #d97706; }
  /* 数据新鲜度 */
  #frBar { flex-shrink: 0; margin: -6px 4px 12px; }
  .fr-bar { width: 100%; display: flex; align-items: center; gap: 8px; border: none; border-radius: 8px; padding: 7px 10px; font-size: 0.76rem; font-family: inherit; cursor: pointer; text-align: left; background: transparent; color: var(--ink-3); }
  .fr-bar:hover { background: var(--chip); }
  .fr-bar.amber { background: #FBF1DF; color: #8A5A0B; }
  .fr-bar.red { background: var(--up-bg); color: var(--up); }
  .fr-bar b { font-weight: 700; }
  .fr-bar .d { width: 7px; height: 7px; border-radius: 50%; background: var(--ok, #1E9E6A); flex: none; }
  .fr-bar.amber .d { background: #B57517; } .fr-bar.red .d { background: var(--up); }
  .fr-bar .go { margin-left: auto; opacity: 0.7; }
  .fr-banner { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 9px 14px; margin: 0 0 12px; font-size: 0.82rem; background: #FBF1DF; color: #6E4A0C; }
  .fr-banner.red { background: var(--up-bg); color: #8E2A21; }
  .fr-banner svg { flex: none; }
  .fr-banner b { font-weight: 700; }
  .fr-banner .sp { flex: 1; min-width: 0; line-height: 1.5; }
  .fr-banner button { border: none; background: rgba(255,255,255,0.7); color: inherit; font-size: 0.76rem; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .fr-banner button:hover { background: #fff; }
  .fr-banner .x { background: none; opacity: 0.6; padding: 4px 6px; }
  .tab .frd { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #B57517; margin-left: 5px; vertical-align: 2px; }
  .tab .frd.red { background: var(--up); }
  .fr-mask { position: fixed; inset: 0; background: rgba(18,22,28,0.42); z-index: 320; display: none; align-items: flex-start; justify-content: center; padding-top: 8vh; }
  .fr-mask.on { display: flex; }
  .fr-modal { background: var(--panel); border-radius: 14px; width: min(1040px, 95vw); max-height: 80vh; overflow-y: auto; padding: 22px 26px 18px; position: relative; }
  .fr-modal h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .fr-modal .sub { font-size: 0.78rem; color: var(--ink-3); margin-bottom: 14px; }
  .fr-modal .cls { position: sticky; top: 0; float: right; margin: -8px -10px 0 12px; z-index: 5; box-shadow: 0 0 0 4px var(--panel); border: none; background: var(--chip); color: var(--ink-2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-family: inherit; }
  .fr-sum { display: flex; gap: 10px; margin-bottom: 14px; }
  .fr-sum div { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 0.74rem; color: var(--ink-3); }
  .fr-sum b { display: block; font-size: 1.5rem; font-weight: 700; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .fr-sum .r b { color: var(--up); } .fr-sum .a b { color: #B57517; } .fr-sum .g b { color: var(--ok, #1E9E6A); }
  .fr-tb { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  .fr-tb th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 0.72rem; padding: 0 8px 8px; }
  .fr-tb td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .fr-tb tr.late td { background: #FFFBF3; } .fr-tb tr.red td { background: #FFF7F6; }
  .fr-tb .nm { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .fr-tb td:first-child { width: 34%; }
  .fr-tb .pg { font-size: 0.7rem; color: var(--ink-3); margin-top: 2px; }
  .fr-tb .mono { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .fr-st { display: inline-block; font-size: 0.72rem; font-weight: 600; border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
  .fr-st.ok { background: var(--down-bg); color: var(--down); }
  .fr-st.run { background: var(--chip); color: var(--ink-2); }
  .fr-st.amber { background: #FBF1DF; color: #8A5A0B; }
  .fr-st.red { background: var(--up-bg); color: var(--up); }
  .fr-tb button { border: none; background: none; color: var(--accent); font-size: 0.74rem; cursor: pointer; padding: 0; font-family: inherit; white-space: nowrap; }
  .fr-note { font-size: 0.72rem; color: var(--ink-3); margin-top: 12px; line-height: 1.6; }
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--ink); color: var(--panel); font-size: 0.85rem;
    padding: 8px 16px; border-radius: 8px; z-index: 99; opacity: 0;
    transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 0.92; }
  .side-sec { font-size: 0.78rem; color: var(--ink-3); padding: 12px 10px 8px; letter-spacing: 0.05em; }
  .side-row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: none; background: transparent; border-radius: 10px;
    padding: 6px 10px; margin-bottom: 1px;
  }
  .side-row:hover { background: var(--bg); }
  .side-row.active { background: var(--chip); }
  .side-row .r1 { display: flex; justify-content: space-between; align-items: baseline; }
  .side-row .nm { font-size: 0.86rem; font-weight: 400; }
  .side-row { position: relative; }
  .side-row .ed { margin-left: auto; margin-right: 6px; width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); opacity: 0; align-self: center; }
  .side-row:hover .ed { opacity: 1; }
  .side-row .ed:hover { background: var(--chip-2); color: var(--ink); }
  .side-add { display: block; width: 100%; text-align: left; border: none; background: transparent; color: var(--ink-3); font-family: inherit; font-size: 0.8rem; padding: 8px 10px; margin-top: 6px; border-radius: 10px; cursor: pointer; }
  .side-add:hover { background: var(--bg); color: var(--accent); }
  /* 持仓 / 关注编辑弹窗 */
  .he-mask { position: fixed; inset: 0; background: rgba(18,22,28,0.42); z-index: 330; display: none; align-items: flex-start; justify-content: center; padding-top: 10vh; }
  .he-mask.on { display: flex; }
  .he-modal { background: var(--panel); border-radius: 14px; width: min(480px, 94vw); max-height: 82vh; overflow-y: auto; padding: 22px 24px 18px; position: relative; }
  .he-modal h3 { margin: 0 0 14px; font-size: 1.1rem; }
  .he-x { position: absolute; top: 14px; right: 14px; border: none; background: var(--chip); color: var(--ink-2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-family: inherit; }
  .he-stock { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
  .he-stock b { font-size: 0.98rem; font-weight: 600; } .he-stock span { font-size: 0.76rem; color: var(--ink-3); }
  .he-f { display: block; margin-bottom: 12px; }
  .he-f > span { display: block; font-size: 0.76rem; color: var(--ink-3); margin-bottom: 5px; }
  .he-f em { font-style: normal; }
  .he-f input, .he-f textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 0.88rem; color: var(--ink); outline: none; resize: vertical; }
  .he-f input:focus, .he-f textarea:focus { border-color: var(--ink-3); }
  .he-row2 { display: flex; gap: 10px; } .he-row2 .he-f { flex: 1; }
  .he-hint { font-size: 0.74rem; color: var(--ink-3); line-height: 1.55; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: -2px 0 12px; }
  .he-srch { position: relative; }
  .he-res { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; z-index: 5; max-height: 280px; overflow-y: auto; box-shadow: 0 6px 18px rgba(18,22,28,0.08); }
  .he-res.on { display: block; }
  .he-it { display: flex; width: 100%; align-items: baseline; gap: 8px; border: none; background: transparent; text-align: left; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-family: inherit; }
  .he-it.hi, .he-it:hover { background: var(--bg); }
  .he-it.dis { opacity: 0.45; cursor: default; }
  .he-it .n { font-size: 0.86rem; color: var(--ink); } .he-it .c { font-size: 0.74rem; color: var(--ink-3); }
  .he-it .t { margin-left: auto; font-size: 0.7rem; color: var(--ink-3); background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .he-none { font-size: 0.8rem; color: var(--ink-3); padding: 8px; }
  .he-pick { font-size: 0.74rem; color: var(--ink-3); margin: -6px 0 12px; display: flex; gap: 10px; }
  .he-pick:empty { display: none; }
  .he-conv { color: var(--accent); }
  .he-err { font-size: 0.78rem; color: var(--up); min-height: 1em; margin-bottom: 8px; line-height: 1.5; }
  .he-act { display: flex; align-items: center; gap: 8px; }
  .he-sp { flex: 1; }
  .he-act button { border: none; border-radius: 8px; padding: 7px 16px; font-family: inherit; font-size: 0.84rem; cursor: pointer; }
  .he-ok { background: var(--ink); color: #fff; } .he-ok:disabled { opacity: 0.35; cursor: default; }
  .he-cancel { background: var(--chip); color: var(--ink-2); }
  .he-del { background: transparent; color: var(--up); padding-left: 0 !important; }
  .he-del:hover { text-decoration: underline; }
  .he-tow { font-size: 0.74rem; color: var(--ink-3); display: flex; align-items: center; gap: 4px; }
  .side-row .r1 { line-height: 1.35; }
  .side-row .pct { font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .side-row .r2 { display: flex; justify-content: space-between; margin-top: 0; line-height: 1.35; }
  .side-row .cd { font-size: 0.68rem; color: var(--ink-3); }
  .side-row .px { font-size: 0.74rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .side-row.ov-side .cd { font-variant-numeric: tabular-nums; }
  .side-row.ov-side .px.up { color: var(--up); } .side-row.ov-side .px.down { color: var(--down); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

  /* ============ 主区 ============ */
  .main { flex: 1; max-width: 1060px; padding: 28px 36px 80px; }

  .stock-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .priv-btn { display: inline-flex; align-items: center; gap: 6px; border: none; background: var(--chip); color: var(--ink-2); font-size: 0.8rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; margin-top: 4px; }
  .priv-btn:hover { color: var(--ink); }
  .priv-btn.on { background: var(--ink); color: #fff; }
  .stock-head h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stock-head .code { font-size: 0.85rem; color: var(--ink-3); font-weight: 400; }
  .stock-head .mkt { font-size: 0.7rem; background: var(--chip); color: var(--ink-2); border-radius: 4px; padding: 2px 7px; font-weight: 400; }
  .head-quote { text-align: right; }
  .head-quote .px { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .head-quote .pct { font-size: 0.9rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .head-note { margin-top: 8px; font-size: 0.82rem; color: var(--ink-3); }
  .head-note b { font-weight: 600; }

  .stock-sticky { position: sticky; top: 0; z-index: 30; background: var(--bg); margin: -28px -36px 0; padding: 20px 36px 0; }
  .ov-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .ov-meta.open { white-space: normal; }
  .ov-meta:hover { color: var(--ink-2); }
  .tabs { display: flex; gap: 4px; margin: 22px 0 26px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    border: none; background: none; cursor: pointer;
    font-size: 0.92rem; color: var(--ink-3); padding: 9px 14px 11px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.g { margin-left: 20px; }
  @container main (max-width: 700px) { .tabs .tab { padding-left: 7px; padding-right: 7px; } .tabs .tab.g { margin-left: 10px; } }
  .tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

  /* 时间轴动态流 */
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before {
    content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px;
    width: 1.5px; background: var(--line);
  }
  .tl-item { position: relative; padding-bottom: 30px; }
  .tl-item::before {
    content: ""; position: absolute; left: -21.5px; top: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--panel); border: 2px solid #C9C4B8;
  }
  .tl-item.tl-latest::before { border-color: var(--accent); background: var(--accent); }
  .tl-meta { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .badge-new { font-size: 0.68rem; color: var(--accent); background: var(--up-bg); border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .senti { font-size: 0.68rem; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .senti.利好 { color: var(--up); background: var(--up-bg); }
  .senti.利空 { color: var(--down); background: var(--down-bg); }
  .senti.中性 { color: var(--ink-2); background: var(--chip); }
  .cat-tag { font-size: 0.68rem; border-radius: 4px; padding: 1px 6px; font-weight: 600; color: var(--normal-ink); background: var(--normal-bg); }
  .tl-title { font-size: 1rem; font-weight: 700; line-height: 1.5; margin: 7px 0 6px; }
  .tl-body { font-size: 0.9rem; color: var(--ink-2); line-height: 1.75; }
  .ref { font-size: 0.68rem; color: var(--ink-3); vertical-align: super; margin: 0 1px; font-weight: 600; }
  .ref:hover { text-decoration: underline; color: var(--accent); }
  .tl-src { font-size: 0.75rem; color: var(--ink-3); margin-top: 6px; }
  .tl-go { margin-left: 10px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .tl-go:hover { text-decoration: underline; }

  /* 信号卡 */
  .sig-card { background: var(--panel); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
  .sig-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sig-name { font-weight: 700; font-size: 1rem; }
  .sig-code { font-size: 0.75rem; color: var(--ink-3); }
  .sig-action { font-size: 0.75rem; font-weight: 700; border-radius: 6px; padding: 3px 10px; }
  .sig-action.bullish { background: var(--bullish-bg); color: var(--bullish-ink); }
  .sig-action.normal { background: var(--normal-bg); color: var(--normal-ink); }
  .sig-action.neutral { background: var(--neutral-bg); color: var(--neutral-ink); }
  .sig-action.watch-close { background: var(--watch-bg); color: var(--watch-ink); }
  .sig-summary { font-size: 0.9rem; color: var(--ink-2); line-height: 1.75; margin-top: 10px; }
  .sig-conds { margin-top: 10px; font-size: 0.85rem; color: var(--ink-2); }
  .sig-conds li { margin: 4px 0 4px 18px; line-height: 1.6; }
  .sig-basis { margin-top: 10px; font-size: 0.75rem; color: var(--ink-3); }
  /* 信号 v2 */
  .s2-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .s2-dir { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.01em; }
  .s2-dir.bull { color: var(--up); } .s2-dir.bear { color: var(--down); } .s2-dir.flat { color: var(--ink-2); }
  .s2-sub { font-size: 0.85rem; color: var(--ink-3); }
  .s2-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 14px; margin-top: 14px; }
  .s2-box { background: var(--bg); border-radius: 12px; padding: 14px 16px; }
  .s2-box h4 { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.03em; }
  .s2-act { display: flex; align-items: center; gap: 10px; }
  .s2-why { margin-top: 8px; font-size: 0.85rem; color: var(--ink-2); line-height: 1.7; }
  .s2-why li { margin-left: 18px; }
  .fac-row { display: grid; grid-template-columns: 104px 1fr 50px; align-items: center; gap: 10px; padding: 7px 0; }
  .fac-row + .fac-row { border-top: 1px solid var(--line); }
  .fac-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
  .fac-name i { font-style: normal; font-weight: 400; color: var(--ink-3); font-size: 0.72rem; margin-left: 4px; }
  .fac-bar { position: relative; height: 8px; background: var(--chip); border-radius: 4px; }
  .fac-bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--chip-2); }
  .fac-bar b { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .fac-bar b.pos { left: 50%; background: var(--up); opacity: 0.8; }
  .fac-bar b.neg { right: 50%; background: var(--down); opacity: 0.75; }
  .fac-val { font-size: 0.8rem; text-align: right; font-variant-numeric: tabular-nums; }
  .fac-txt { grid-column: 2 / 4; font-size: 0.75rem; color: var(--ink-3); line-height: 1.5; margin-top: -2px; }
  .fac-row.na .fac-name { color: var(--ink-3); }
  .fac-row.has-d .fac-txt { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-self: start; border-radius: 4px; }
  .fac-row.has-d .fac-txt:hover { color: var(--ink-2); }
  .fac-more { font-size: 0.72rem; color: var(--accent); white-space: nowrap; }

  .op-fin-l { display: flex; gap: 16px; font-size: 0.72rem; color: var(--ink-3); margin-top: 2px; }
  .op-fin-l i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .op-peer-r { display: grid; grid-template-columns: 120px 1fr 52px; align-items: center; gap: 10px; font-size: 0.82rem; padding: 4px 0; color: var(--ink-2); }
  .op-peer-r .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 结构化小节 */
  .op-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 6px 0 14px; }

  .op-card .t span { width: 20px; height: 20px; border-radius: 6px; background: var(--chip-2); color: var(--ink-2); font-size: 0.72rem; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .op-card .d { font-size: 0.88rem; line-height: 1.75; color: var(--ink-2); }

  .op-thesis .n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--chip); color: var(--ink-2); font-weight: 700; font-size: 0.82rem; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
  .op-misread { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 6px 0 14px; }
  .op-mr { background: var(--bg); border-radius: 12px; padding: 14px 16px; font-size: 0.9rem; line-height: 1.8; color: var(--ink-2); }

  .op-risks svg { flex: 0 0 auto; color: var(--neutral-ink); margin-top: 4px; }
  .op-tl { position: relative; margin: 8px 0 14px; padding-left: 4px; }

  .op-tl-i::before { content: ""; position: absolute; left: 4px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--chip-2); box-sizing: border-box; }
  .op-tl-i::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 1px; background: var(--line); }

  .op-tl-i .what b { font-size: 0.93rem; }

  .op-vstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; background: var(--bg); border-radius: 12px; padding: 12px 16px; margin: 4px 0 4px; }
  .op-vstrip > div { display: flex; flex-direction: column; gap: 2px; }

  /* 侧栏拖拽手柄（8px 热区覆盖在分界线上，常态可见便于发现） */
  .resizer { width: 8px; flex-shrink: 0; margin: 0 -4px; z-index: 20; cursor: col-resize; background: transparent; position: relative; touch-action: none; }
  .resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background 0.15s; }
  .resizer:hover::after, .resizer.on::after { background: #C9C4B8; }
  body.dragging { user-select: none; cursor: col-resize; }
  body.dragging * { cursor: col-resize !important; }

  /* 侧栏 Tab */

      (bad.length ? '<div style="margin-top:12px;text-align:right"><button class="ex-gen-all" data-fr="copyall" style="border:none;background:var(--accent);color:#fff;font-size:0.8rem;border-radius:7px;padding:6px 14px;cursor:pointer;font-family:inherit">一键补跑全部逾期项</button></div>' : "") +

  /* ---------- 持仓分组与排序 ---------- */
  var POS_ORDER_KEY = "panel.posOrder";
  var MKT_SEQ = ["港股", "A股", "美股", "其他"];
  function marketOf(s) {
    var m = s.market || "";
    if (m.indexOf("港") >= 0) return "港股";
    if (m.indexOf("A") >= 0 || m.indexOf("沪") >= 0 || m.indexOf("深") >= 0) return "A股";
    if (m.indexOf("美") >= 0) return "美股";
    var c = s.code || "";
    if (/\.HK$/i.test(c)) return "港股";
    if (/\.(SH|SZ|BJ|SS)$/i.test(c)) return "A股";
    if (/\.(US|O|N|A)$/i.test(c)) return "美股";
    return "其他";
  }
  /* 仓位大小 = 现价(无行情用成本价) × 股数，组内同币种可比 */
  function posValue(s) {
    var q = state.quotes[s.gtimg];
    var px = q && q.price != null ? q.price : (s.cost != null ? s.cost : 0);
    return px * (s.shares || 0);
  }
  function getPosOrder() {
    try { var v = JSON.parse(localStorage.getItem(POS_ORDER_KEY) || "null"); return Array.isArray(v) ? v : null; }
    catch (e) { return null; }
  }
  /* 组内排序：有手动顺序按手动，否则按仓位市值降序 */
  function sortedGroup(list) {
    var order = getPosOrder();
    return list.slice().sort(function (a, b) {
      if (order) {
        var ia = order.indexOf(a.code), ib = order.indexOf(b.code);
        if (ia >= 0 || ib >= 0) {
          if (ia < 0) return 1;
          if (ib < 0) return -1;
          return ia - ib;
        }
      }
      return posValue(b) - posValue(a);
    });
  }
  function groupPositions(positions) {
    var groups = {};
    positions.forEach(function (s) {
      var m = marketOf(s);
      (groups[m] = groups[m] || []).push(s);
    });
    return groups;
  }

  /* ---------- 持仓行拖拽排序（限同市场组内，顺序持久化 localStorage） ---------- */
  var draggingCode = null;
  function clearDropMarks() {
    Array.prototype.forEach.call(document.querySelectorAll(".drop-before,.drop-after"), function (x) {
      x.classList.remove("drop-before"); x.classList.remove("drop-after");
    });
  }
  function bindPosDnD() {
    Array.prototype.forEach.call(document.querySelectorAll(".side-row[data-pos]"), function (el) {
      el.addEventListener("dragstart", function (e) {
        draggingCode = el.getAttribute("data-code");
        el.classList.add("drag-src");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", draggingCode); } catch (err) {}
      });
      el.addEventListener("dragend", function () {
        draggingCode = null;
        clearDropMarks();
        el.classList.remove("drag-src");
      });
      el.addEventListener("dragover", function (e) {
        var dstCode = el.getAttribute("data-code");
        if (!draggingCode || draggingCode === dstCode) return;
        var src = findStock(draggingCode), dst = findStock(dstCode);
        if (!src || !dst || marketOf(src) !== marketOf(dst)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        var r = el.getBoundingClientRect();
        var before = (e.clientY - r.top) < r.height / 2;
        clearDropMarks();
        el.classList.add(before ? "drop-before" : "drop-after");
      });
      el.addEventListener("drop", function (e) {
        e.preventDefault();
        var dstCode = el.getAttribute("data-code");
        var srcCode = draggingCode;
        if (!srcCode || srcCode === dstCode) return;
        var src = findStock(srcCode), dst = findStock(dstCode);
        if (!src || !dst || marketOf(src) !== marketOf(dst)) return;
        var r = el.getBoundingClientRect();
        var before = (e.clientY - r.top) < r.height / 2;
        movePos(srcCode, dstCode, before);
        renderSidebar();
      });
    });
  }
  function movePos(srcCode, dstCode, before) {
    /* 当前展示顺序（按市场组拼接） */
    var groups = groupPositions(state.holdings.positions || []);
    var seq = [];
    MKT_SEQ.forEach(function (m) {
      if (groups[m]) sortedGroup(groups[m]).forEach(function (s) { seq.push(s.code); });
    });
    var si = seq.indexOf(srcCode);
    if (si < 0) return;
    seq.splice(si, 1);
    var di = seq.indexOf(dstCode);
    if (di < 0) return;
    seq.splice(before ? di : di + 1, 0, srcCode);
    localStorage.setItem(POS_ORDER_KEY, JSON.stringify(seq));
  }
  function sideTabBtn(key, label) {
    return '<button class="side-tab' + (state.sideTab === key ? " active" : "") + '" data-stab="' + key + '">' + esc(label) + "</button>";
  }
  function themeRow(t) {

      if (q) { priced++; if (q.pct > 0) upN++; else if (q.pct < 0) downN++; }
    });

    return '<button class="side-row' + active + '" data-code="theme:' + esc(t.id) + '">' +

      (priced ? '<span class="r2"><span class="cd">今日</span><span class="px"><span class="up">' + upN + '</span> 涨 / <span class="down">' + downN + "</span> 跌</span></span>" : "") +

  function sideRow(code, name, sub, stock, isPos, kind) {
    var ek = isPos ? "pos" : kind;
    var edBtn = ek && stock ? '<span class="ed" role="button" tabindex="-1" title="编辑 / ' + (ek === "pos" ? "删除" : "取消关注") + '" data-hedit="' + esc(code) + '" data-hkind="' + ek + '">' +
      '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M10.8 2.6l2.6 2.6-7.6 7.6H3.2v-2.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>' : "";
    var q = stock && state.quotes[stock.gtimg];

      (pct != null ? '<span class="pct ' + cls + '" data-qpct="' + esc(stock.gtimg) + '">' + fmtPct(pct) + "</span>" : "") +
      '</span>' +
      (sub ? '<span class="r2"><span class="cd">' + esc(sub) + '</span><span class="px" data-qpx="' + esc(stock.gtimg) + '">' +
        (q ? fmtPx(q.price, stock.currency) : "") + "</span></span>" : "") +

  /* 侧栏「组合总览」行：与个股行同一版式——右上今日涨跌幅（按人民币市值加权，实时），下行左「N 只」、右今日涨跌额（折人民币，隐私模式打码） */
  function portLive() {
    var P = state.holdings.positions || [], fx = (state.diag && state.diag.fx && state.diag.fx.rates) || { CNY: 1, HKD: 0.85, USD: 6.7 };
    var mv = 0, prev = 0, cost = 0, n = 0, q0 = 0;
    P.forEach(function (s) {
      var sh = Number(s.shares) || 0; if (!sh) return;
      var r = fx[s.currency || "CNY"] || 1, q = state.quotes[s.gtimg];
      var px = q && q.price != null ? q.price : s.cost; if (px == null) return;
      var pct = q && q.pct != null ? q.pct : 0; if (q) q0++;
      mv += px * sh * r; prev += px / (1 + pct / 100) * sh * r; cost += (Number(s.cost) || 0) * sh * r; n++;
    });
    return { n: P.length, mv: mv, day: q0 && prev ? (mv / prev - 1) * 100 : null, dayAmt: q0 && prev ? mv - prev : null, pnl: cost ? (mv / cost - 1) * 100 : null };
  }
  function ovSideInner() {
    var L = portLive();
    return '<span class="r1"><span class="nm">组合总览</span>' + (L.day != null ? '<span class="pct ' + pctClass(L.day) + '" title="今日涨跌（按人民币市值加权）">' + fmtPct(L.day) + "</span>" : "") + "</span>" +

  }

  }

  /* ---------- 主区 ---------- */
  function renderMain() {

  /* 公司总览：左侧目录滚动高亮当前节 */
  /* 注意：每次 renderMain 都会重建 DOM，mark() 必须实时查询链接，不能闭包缓存旧 NodeList */
  var opSpyBound = false, opSpyLockUntil = 0;
  function opSpySet(a) {
    Array.prototype.forEach.call(document.querySelectorAll(".op-toc a[data-opsec]"), function (x) { x.classList.toggle("cur", x === a); });
  }
  function opSpyMark() {
    if (Date.now() < opSpyLockUntil) return;
    var links = document.querySelectorAll(".op-toc a[data-opsec]");
    if (!links.length) return;
    var cur = links[0];
    var se = document.scrollingElement || document.documentElement;
    if (se.scrollTop + window.innerHeight >= se.scrollHeight - 4) cur = links[links.length - 1];
    else Array.prototype.forEach.call(links, function (a) {
      var sec = document.getElementById(a.getAttribute("data-opsec"));
      if (sec && sec.getBoundingClientRect().top < 220) cur = a;
    });
    opSpySet(cur);
  }
  function setupOpSpy() {
    if (!document.querySelector(".op-toc a[data-opsec]")) return;
    opSpyMark();
    if (opSpyBound) return;
    opSpyBound = true;
    window.addEventListener("scroll", opSpyMark, { passive: true });
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest(".op-toc a[data-opsec]");
      if (!a) return;
      opSpySet(a);
      opSpyLockUntil = Date.now() + 600;  /* 点击跳转后短暂锁定，避免末尾几节到不了阈值被覆盖 */
    });
  }

  /* ========== 主题页 ========== */
  function renderTheme(id) {

    themes.forEach(function (x) { if (x.id === id) t = x; });
    if (!t) return '<div class="empty">未找到主题</div>';
    var members = (t.members || []).map(findStock).filter(Boolean);
    var upN = 0, downN = 0;
    members.forEach(function (s) {
      var q = state.quotes[s.gtimg];
      if (q) { if (q.pct > 0) upN++; else if (q.pct < 0) downN++; }
    });

    var html = '<div class="stock-head"><div><h1>' + esc(t.name) + ' <span class="mkt">主题 · ' + members.length + " 只成分</span></h1></div>" +
      '<div class="head-quote"><div class="pct" style="font-size:1rem">' +

  function renderMktNote(note) {
    var groups = [];
    String(note).split("。").forEach(function (sent) {
      sent = sent.trim();
      if (!sent) return;
      var ci = sent.indexOf("：");
      var head = "", rest = sent;
      if (ci > 0 && ci < 40) { head = sent.slice(0, ci); rest = sent.slice(ci + 1); }
      var items = rest.split(/[；;]/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (items.length) groups.push({ head: head, items: items });
    });
    if (!groups.length || (groups.length === 1 && groups[0].items.length === 1 && !groups[0].head)) {
      return '<div class="mkt-note">' + highlight(note) + "</div>";
    }
    var html = '<div class="mkt-note">';
    groups.forEach(function (g) {
      if (g.head) html += '<div class="mkt-h">' + highlight(g.head) + "</div>";
      html += '<ul class="mkt-list">' + g.items.map(function (it) {

  /* ===== 组合「决策一览」（2026-10-02，原「买卖信号」）=====
     每只股票的结论 = 个股「决策」Tab 的同一个 decideStock()：长期四维 + 仓位纪律（价格只描述状态），颜色、文案、一句话完全一致。
     周更观点降为每行的参考信息；与结论方向不一致时标「与周更观点不同」，展开可看原文。 */
  var BD_GROUPS = [
    ["now", "先处理", "止损 / 证伪 / 重点审视", { stop: 1, "watch-close": 1 }],
    ["cut", "减仓审视", "控制仓位，不补仓", { neutral: 1 }],
    ["hold", "持有", "维持现状，按计划执行", { normal: 1 }],
    ["add", "偏多 / 可加仓", "公司偏强且纪律未拦，可按计划分批", { bullish: 1 }],
    ["na", "信息不足", "有数据的维度少于 2 个", { insuff: 1 }]
  ];
  function bdRow(st, d) {
    var lv = DC_LEVEL[d.level] || DC_LEVEL.insuff, sx = d.s2, longLv = dcLongLv(d), wk = sigFor(st.code), isH = st.type === "holding";
    var pp = isH ? portPos(st.code) : null;

    if (isH && d.pnlPct != null) facts.push('浮盈亏 <b class="' + pctClass(d.pnlPct) + '">' + fmtPct(d.pnlPct) + "</b>");
    if (pp && pp.weight != null) facts.push("仓位 <b" + (pp.weight > d.T.pos ? ' class="warn" title="超过单股上限"' : "") + ">" + pp.weight.toFixed(1) + "%</b>");
    var va = state.valAll && state.valAll[st.code];
    if (!isH && va && va.ok && va.verdict && va.verdict !== "暂无结论") facts.push("估值 <b>" + esc(va.verdict) + "</b>");
    var read = dcRead(d, st) || (d.insufficient ? "有数据的维度不足 2 个，先补数据再判断。" : "");
    return '<div class="bd-row" data-bd-go="' + esc(st.code) + '" title="打开「' + esc(st.name) + '」决策页">' +
      '<span class="bd-name"><b>' + esc(st.name) + "</b><em>" + esc(st.code) + (facts.length ? " · " + facts.join(" · ") : "") + "</em></span>" +
      '<span class="bd-verdict" style="background:' + lv.bg + ";color:" + lv.c + '">' + esc(d.verdict) + "</span>" +
      '<span class="bd-cell"><em>长期</em><b>' + (longLv === "na" ? "--" : Math.round(d.score)) + '</b><i class="dc-pill ' + longLv + '">' + DC_LONG_TXT[longLv] + "</i></span>" +
      '<span class="bd-cell"><em>价格</em><b class="pxs" title="' + esc((pxPlain(sx && sx.state) || {}).head || "") + '">' + esc((pxPlain(sx && sx.state) || {}).short || "--") + "</b></span>" +
      '<span class="bd-cell"><em>纪律</em>' + (sx ? '<span class="sig-action ' + esc(sx.action_level) + '">' + esc(sx.action) + "</span>" : "<b>--</b>") + "</span>" +
      '<span class="bd-read">' + esc(read) +
        (wk && wk.action ? '<span class="bd-wk1">周更观点 · ' + esc(wk.action) + "</span>" : "") + "</span></div>";
  }
  function renderDecideBoard(a) {
    if (!state.sigv2) return '<div class="empty">正在计算价格与纪律数据（首次约 3-5 秒）…</div>';
    var hold = (state.holdings.positions || []), watch = (state.holdings.watch || []);

    var html = "";

      "周更观点只作参考，不参与计算。</div>";

  /* 组合「动态」（2026-10-16 用户要求）：与个股「动态」同款时间线条目；
     日期右侧标明股票与持仓/关注；只直显最近 3 天，更早的（最多 15 天）默认折叠。 */
  function renderOvNews() {
    var all = (state.holdings.positions || []).concat(state.holdings.watch || []);
    var today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
    var items = [];
    all.forEach(function (st) {
      (tlFor(st.code).items || []).forEach(function (c) {
        items.push({ c: c, lbl: st.name + " · " + (st.type === "holding" ? "持仓" : "关注") });
      });
    });
    items.sort(function (a, b) { return String(b.c.date).localeCompare(String(a.c.date)); });
    var t3 = Date.parse(today + "T00:00:00+08:00") - 2 * 864e5, t15 = Date.parse(today + "T00:00:00+08:00") - 14 * 864e5;
    var recent = [], rest = [];
    items.forEach(function (x) {

      (rest.length ? '<details class="tl-more" data-fold="tl-more:ov"><summary>查看更早 ' + rest.length + ' 条动态（3 天前，最多到 15 天）</summary><div class="timeline">' + rest.map(function (x) { return tlItemHtml(x.c, false, x.lbl); }).join("") + "</div></details>" : "");

  /* 组合分析（持仓台账，按市场分组） */
  function renderPortfolio() {
    var positions = (state.holdings.positions || []);
    var filled = positions.filter(function (p) { return p.cost != null && p.shares != null; });
    var html = '<div class="sec-title">组合分析 <span style="font-size:0.72rem;font-weight:400;color:var(--ink-3)">按市场分组 · 仓位=组内市值占比 · 点击行查看标的详情</span></div>';
    if (!filled.length) {
      html += '<div class="guide-box">在 <code>panel/data/holdings.json</code> 中为持仓填入 <code>cost</code>（成本价）与 <code>shares</code>（股数）后，此处自动计算浮动盈亏、仓位占比与行业集中度。</div>';
      return html;
    }
    var groups = groupPositions(filled);
    var bySector = {};
    MKT_SEQ.forEach(function (m) {
      var g = groups[m];
      if (!g || !g.length) return;
      var list = sortedGroup(g);
      var rows = "", mvSum = 0, costSum = 0, pnlSum = 0, hasQ = false;
      list.forEach(function (p) {
        var q = state.quotes[p.gtimg];
        if (q) { mvSum += q.price * p.shares; hasQ = true; }
        costSum += p.cost * p.shares;
      });
      list.forEach(function (p) {
        var q = state.quotes[p.gtimg];
        var px = q ? q.price : null;
        var mv = px != null ? px * p.shares : null;
        var costMv = p.cost * p.shares;
        var pnl = mv != null ? mv - costMv : null;
        var pnlPct = mv != null && costMv ? (mv - costMv) / costMv * 100 : null;
        var w = mv != null && mvSum ? mv / mvSum * 100 : null;
        if (mv != null) { pnlSum += pnl; bySector[p.sector || "其他"] = (bySector[p.sector || "其他"] || 0) + mv; }
        var pnlCls = pnl == null ? "flat" : pnl > 0 ? "up" : pnl < 0 ? "down" : "flat";
        rows += '<tr class="pf-row" data-go="' + esc(p.code) + '"><td><div class="pf-name">' + esc(p.name) + '</div><div class="pf-code">' + esc(p.code) + "</div></td><td>" +
          pv(curSym(p.currency) + fmtNum(p.cost)) + "</td><td>" + pv(fmtNum(p.shares, 0)) + "</td><td>" +
          (px != null ? curSym(p.currency) + fmtNum(px) : "--") + "</td><td>" +
          (q ? '<span class="pf-pill ' + pctClass(q.pct) + '">' + fmtPct(q.pct) + "</span>" : "--") + "</td><td>" +
          (mv != null ? pv(curSym(p.currency) + fmtNum(mv, 0)) : "--") + "</td><td>" +
          (w != null ? '<div class="pf-w"><span>' + w.toFixed(1) + '%</span><div class="w-bar"><div class="w-fill" style="width:' + w.toFixed(1) + '%"></div></div></div>' : "--") + "</td><td>" +
          (pnl != null ? '<span class="pf-pill ' + pnlCls + '">' + pv((pnl > 0 ? "+" : "") + fmtNum(pnl, 0)) + " (" + fmtPct(pnlPct) + ")</span>" : "--") + "</td></tr>";
      });

  /* ---------- 公司总览增强：名片卡 / 财务迷你图 / 结构化小节 ---------- */
  function opFund(code) { return state.fundamentals && state.fundamentals.items ? state.fundamentals.items[code] : null; }
  function opRes(code) { return state.research && state.research.items ? state.research.items[code] : null; }
  function opSig(code) { var x = null; ((state.analysis && state.analysis.signals) || []).forEach(function (s) { if (s.code === code) x = s; }); return x; }
  function opVal(code) { var p = state.p1 && state.p1["val_" + code]; return p && p.ok ? p : null; }
  function opToday() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
  function opDays(d) { var m = String(d || "").match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; return Math.round((Date.parse(m[1] + "-" + m[2] + "-" + m[3]) - Date.parse(opToday())) / 864e5); }
  function opRange(lo, hi, cur, ticks, cls) {
    if (lo == null || hi == null || cur == null || !(hi > lo)) return "";
    var P = function (v) { return Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100)).toFixed(1); };
    return '<div class="oh-bar ' + (cls || "") + '">' + (ticks || []).map(function (t) { return '<i class="tk" style="left:' + P(t) + '%"></i>'; }).join("") + '<b style="left:' + P(cur) + '%"></b></div>';
  }
  function opHero(code) {
    var st = findStock(code);

    st = st || {};
    var q = st.gtimg ? state.quotes[st.gtimg] : null;
    var L = (f && f.latest) || {}, A = (f && f.annual) || {}, v = (f && f.valuation) || {};
    var e = state.earnings && state.earnings.items ? state.earnings.items[code] : null, e0 = e && e.periods && e.periods[0];
    var cur = st.currency || (r && r.currency) || (f && f.cap_currency);
    var px = q && q.price != null ? q.price : r && r.current_price;
    /* 顶部：身份 + 价格 + 信号 */
    var tags = [st.market, st.sector, st.type === "holding" ? "持仓" : st.type === "watch" ? "关注" : ""].filter(Boolean);
    var h = '<div class="op-hero" id="op-' + esc(code) + '-hero"><div class="oh-top"><div class="oh-id">' +
      '<div class="oh-tags">' + tags.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</div>" +
      '</div><div class="oh-px"><div class="v ' + (q ? pctClass(q.pct) : "") + '">' + (px != null ? fmtPx(px, cur) : "--") + "</div>" +
      '<div class="s">' + (q && q.pct != null ? '今日 <b class="' + pctClass(q.pct) + '">' + fmtPct(q.pct) + "</b>" : "") + "</div></div></div>";
    /* 关键指标 8 格 */
    var roe = L.roe_annualized != null ? L.roe_annualized : A.roe_annualized;
    var kp = [];
    if (f && f.market_cap != null) kp.push(["总市值", f.market_cap >= 1e4 ? fmtNum(f.market_cap / 1e4, 2) + " 万亿" : fmtNum(f.market_cap, 0) + " 亿", f.cap_currency || "", ""]);
    var per = String(L.period || "").replace(/[（(].*$/, "");
    if (v.pe_forward != null || v.pe_ttm != null) kp.push(["PE", fmtNum(v.pe_forward != null ? v.pe_forward : v.pe_ttm, 1) + " 倍", v.pe_forward != null ? "动态" : "TTM", ""]);
    if (roe != null) kp.push(["ROE 年化", fmtNum(roe, 1) + "%", roe >= 15 ? "≥15% 达标" : "<15% 未达标", roe >= 15 ? "ok" : "bad"]);
    if (L.gross_margin != null) kp.push(["毛利率", fmtNum(L.gross_margin, 1) + "%", per, ""]);
    if (L.net_margin != null) kp.push(["净利率", fmtNum(L.net_margin, 1) + "%", per, ""]);
    if (L.debt_ratio != null) kp.push(["资产负债率", fmtNum(L.debt_ratio, 1) + "%", L.debt_ratio <= 60 ? "≤60% 达标" : ">60% 未达标", L.debt_ratio <= 60 ? "ok" : "bad"]);
    var ry = e0 && e0.rev_yoy != null ? e0.rev_yoy : L.rev_yoy;
    if (ry != null) kp.push(["营收同比", fmtPct(ry), e0 ? e0.period : per, ry >= 0 ? "up" : "down"]);
    if (e0 && e0.np_yoy != null) kp.push(["净利同比", fmtPct(e0.np_yoy), e0.period, e0.np_yoy >= 0 ? "up" : "down"]);
    var kc = kp.length > 4 ? Math.ceil(kp.length / 2) : kp.length, kspan = Math.ceil(kp.length / kc) * kc - kp.length + 1;
    if (kp.length) h += '<div class="oh-kpi" style="grid-template-columns:repeat(' + kc + ',1fr)">' + kp.map(function (k, i) {
      return '<div' + (i === kp.length - 1 && kspan > 1 ? ' style="grid-column:span ' + kspan + '"' : "") + '><span class="k">' + esc(k[0]) + '</span><b class="' + (k[3] === "up" || k[3] === "down" ? k[3] : "") + '">' + esc(k[1]) + '</b><span class="s ' + (k[3] === "ok" || k[3] === "bad" ? k[3] : "") + '">' + esc(k[2]) + "</span></div>";
    }).join("") + "</div>";
    /* 区间与预期 4 格 */
    var cells = [];

      var pos = (q.price - q.low52) / (q.high52 - q.low52) * 100;
      cells.push('<div class="oh-c"><div class="k">52 周位置<b>' + Math.round(pos) + '%</b></div>' + opRange(q.low52, q.high52, q.price) +

    }
    if (r && r.target_avg != null && px) {

      cells.push('<div class="oh-c"><div class="k">机构目标价<b class="' + pctClass(up) + '">' + (up >= 0 ? "空间 " : "") + fmtPct(up) + "</b></div>" + opRange(lo, hi, px, [r.target_avg], "tgt") +
        '<div class="oh-ends"><span>' + fmtNum(r.target_min) + "</span><span>均 " + fmtNum(r.target_avg) + " · " + (r.target_count || "--") + " 家</span><span>" + fmtNum(r.target_max) + "</span></div></div>");

        '<div class="oh-ends"><span>买 ' + rt.buy + "</span><span>持 " + rt.hold + "</span><span>卖 " + rt.sell + "</span></div></div>");
    }

    var nd = (nx && nx.publish_date) || (up2 && up2.date);

        '<div class="oh-ends"><span>' + (nx && nx.np_yoy != null ? '一致预期净利 <b class="' + pctClass(nx.np_yoy) + '">' + fmtPct(nx.np_yoy) + "</b>" : "") + "</span></div></div>");

  /* 近 N 季营收 / 净利柱 + 毛利率折线（SVG，旧→新） */
  function opFinChart(code) {
    var e = state.earnings && state.earnings.items ? state.earnings.items[code] : null;
    if (!e || !e.periods || e.periods.length < 2) return "";
    var seq = e.periods.slice(0, 8).reverse(), n = seq.length;
    var W0 = 640, H0 = 190, Lp = 8, Rp = 44, T = 22, B = 26, cw = (W0 - Lp - Rp) / n;
    var mx = 0; seq.forEach(function (p) { mx = Math.max(mx, Math.abs(p.revenue || 0), Math.abs(p.net_profit || 0)); });
    if (!mx) return "";
    var base = H0 - B, hh = base - T, Y = function (x) { return Math.abs(x) / mx * hh; };
    var gm = seq.map(function (p) { return p.gross_margin; }).filter(function (x) { return x != null; });
    var gl = Math.min.apply(null, gm.concat([100])), gh = Math.max.apply(null, gm.concat([0])), gs = Math.max(4, gh - gl);
    var GY = function (x) { return T + 6 + (1 - (x - (gl - gs * 0.3)) / (gs * 1.6)) * (hh - 12); };
    var s = "", pts = [];
    seq.forEach(function (p, i) {
      var x0 = Lp + i * cw, bw = Math.min(22, cw * 0.28);
      var rh = Y(p.revenue || 0), nh = Y(p.net_profit || 0), neg = (p.net_profit || 0) < 0;
      s += '<rect x="' + (x0 + cw / 2 - bw - 1).toFixed(1) + '" y="' + (base - rh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, rh).toFixed(1) + '" rx="2" fill="var(--chip-2)"><title>营收 ' + fmtNum(p.revenue) + "</title></rect>";
      s += '<rect x="' + (x0 + cw / 2 + 1).toFixed(1) + '" y="' + (base - nh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, nh).toFixed(1) + '" rx="2" fill="var(' + (neg ? "--down" : "--up") + ')" opacity="0.8"><title>净利 ' + fmtNum(p.net_profit) + "</title></rect>";
      s += '<text x="' + (x0 + cw / 2).toFixed(1) + '" y="' + (H0 - 8) + '" font-size="11" text-anchor="middle" fill="var(--ink-3)">' + esc(shortPeriod(p.period)) + "</text>";
      if (p.gross_margin != null) pts.push([x0 + cw / 2, GY(p.gross_margin), p.gross_margin]);
    });
    s += '<line x1="' + Lp + '" x2="' + (W0 - Rp) + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/>';
    if (pts.length > 1) {

     数字与大白话全部由程序从原始数据拼出；亏损股不写同比百分比，写「亏损收窄 / 扩大 X 亿」；负净资产 ROE、|净利率|>100% 不上颜色。 */

  function erPlain(p0, yo, ps) {

      '<span class="senti ' + esc(n.sentiment) + '">' + esc(n.sentiment) + "</span></div>" +
      '<div class="tl-title">' + esc(n.title) + "</div>" +
      '<div class="tl-body">' + highlight(n.summary) +
      (n.url ? ' <a class="ref" href="' + esc(n.url) + '" target="_blank" rel="noopener">[1]</a>' : "") +
      "</div>" +
      '<div class="tl-src">来源：' + esc(n.source) + "</div>" +
      "</div>";
  }

  /* ---------- 侧栏宽度拖拽 ---------- */
  (function initResizer() {
    var sidebar = document.getElementById("sidebar");
    var resizer = document.getElementById("resizer");
    var MIN = 272, MAX = 400, KEY = "panel.sidebarW";
    var saved = parseInt(localStorage.getItem(KEY) || "", 10);
    if (saved >= MIN && saved <= MAX) sidebar.style.width = saved + "px";
    resizer.addEventListener("mousedown", function (e) {
      e.preventDefault();
      resizer.classList.add("on");
      document.body.classList.add("dragging");
      function move(ev) {
        var w = Math.min(MAX, Math.max(MIN, ev.clientX));
        sidebar.style.width = w + "px";
      }
      function up() {
        resizer.classList.remove("on");
        document.body.classList.remove("dragging");
        localStorage.setItem(KEY, String(parseInt(sidebar.getBoundingClientRect().width, 10)));
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
      }
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
    resizer.addEventListener("dblclick", function () {
      sidebar.style.width = "272px";
      localStorage.removeItem(KEY);
    });
  })();

  /* ---------- 启动 ---------- */
  (function () {  /* 启动时从 #代码/Tab 恢复（可分享链接与截图入口） */
    try {
      var h = location.hash.slice(1).split("/");
      if (h[0] && h[0] !== "overview") { if (h[1]) state.tab = decodeURIComponent(h[1]); state.selected = decodeURIComponent(h[0]); }
    } catch (e) {}
  })();
  loadAll();
  /* 刷新频率来自设置「显示」：行情轮询秒数 / 数据重载分钟数，保存后即时重排 */
  var tPoll = null, tLoad = null, curPoll = 0, curLoad = 0;
  function resched() {
    var d = (state.settings && state.settings.display) || {};
    var ps = Math.max(3, Number(d.poll_sec) || 5), lm = Math.max(1, Number(d.reload_min) || 5);
    if (ps !== curPoll) { if (tPoll) clearInterval(tPoll); tPoll = setInterval(pollQuotes, ps * 1000); curPoll = ps; }
    if (lm !== curLoad) { if (tLoad) clearInterval(tLoad); tLoad = setInterval(loadAll, lm * 60000); curLoad = lm; }
  }
  window.WB_RESCHED = function () { resched(); };
  resched();
  document.getElementById("btnSettings").addEventListener("click", function () { if (window.SET) SET.open(state.selected === "settings" ? String(state.tab || "").replace(/^set-/, "") : "model"); });
  refreshStatus();
  setInterval(refreshStatus, 600000);
  loadFresh();
  setInterval(loadFresh, 300000);
  document.getElementById("btnRefresh").addEventListener("click", function () {
    var b = this;
    if (b.classList.contains("spin")) return;
    b.classList.add("spin");
    /* 刷新语义：行情快照 + 缺口检查（新增标的未建数 / 数据逾期）→ 后台启动对应任务补齐 */
    apiPost("/api/refresh", {}).then(function (r) {
      if (!r || !r.ok) { toast((r && (RF_REASON[r.reason] || r.error)) || "刷新失败"); return; }
      var msg = "行情已刷新 · " + r.count + " 只" + (r.cached ? "（5 分钟内缓存）" : "");
      var g = r.gaps || {};
      var parts = [];
      if (g.new && g.new.length) parts.push("新增 " + g.new.length + " 只待建数据（" + g.new.slice(0, 3).join("、") + (g.new.length > 3 ? "…" : "") + "）");
      if (g.stale && g.stale.length) parts.push("逾期：" + g.stale.join("、"));
      if (parts.length) msg += "｜" + parts.join("；") + (r.started && r.started.length ? "｜已启动补齐" : "");
      else msg += "｜全部数据按计划更新";
      toast(msg);
      return mergeLiveQuotes();
    }).then(function () {
      updateQuoteDOM();
      refreshStatus();
      loadFresh();
    }).catch(function () {
      toast("刷新请求失败");
    }).then(function () {
      b.classList.remove("spin");
    });
  });
})();
</script>
<script>
(function () {
  var el = document.getElementById("sideList"); if (!el) return;
  var t = null;
  el.addEventListener("scroll", function () {
    el.classList.add("scrolling");
    if (t) clearTimeout(t);
    t = setTimeout(function () { el.classList.remove("scrolling"); }, 800);
  }, { passive: true });
})();
</script>
</body>
